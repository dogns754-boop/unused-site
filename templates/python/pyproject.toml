[project]
name = "__NAME__"
version = "0.1.0"
description = "__DESC__"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
__NAME__ = "__PKG__.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
