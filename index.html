<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준비 중</title>
<style>
:root{--bg:#F6F7F9;--ink:#1F2733;--ink2:#5E6875;--line:#DDE3EA}
@media (prefers-color-scheme: dark){:root{--bg:#12161C;--ink:#EDF1F6;--ink2:#9AA6B4;--line:#2A333F}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:0 16px}
main{text-align:center;max-width:32rem}
h1{font-size:clamp(26px,6vw,36px);margin:0 0 10px}
p{color:var(--ink2);margin:0;line-height:1.6}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2FC3AE;margin-bottom:18px;
  box-shadow:0 0 0 6px color-mix(in srgb,#2FC3AE 20%,transparent)}
</style>
</head>
<body>
<main>
  <span class="dot" aria-hidden="true"></span>
  <h1>새 사이트 준비 중</h1>
  <p>곧 이곳에 새로운 사이트가 열립니다.</p>
</main>
</body>
</html>
